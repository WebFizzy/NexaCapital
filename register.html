    <main>
      <section class="section">
        <div class="container">
          <div class="card form-card">
            <div class="notice" style="margin-bottom: 22px">
              Create Your Account
            </div>
            <form
              id="register-form"
              data-demo-form
              data-success-message="Registration fields validated. No account was created."
            >
              <div class="form-grid">
                <div class="field">
                  <label for="first">First name</label
                  ><input
                    id="first"
                    required
                    autocomplete="off"
                    placeholder="Sample"
                  />
                </div>
                <div class="field">
                  <label for="last">Last name</label
                  ><input
                    id="last"
                    required
                    autocomplete="off"
                    placeholder="User"
                  />
                </div>
              </div>
              <div class="field">
                <label for="email">Email address</label
                ><input
                  id="email"
                  type="email"
                  required
                  autocomplete="off"
                  placeholder="sample@example.com"
                />
              </div>
              <div class="field">
                <label for="password">Sample password</label>
                <div style="display: flex; gap: 8px">
                  <input
                    id="password"
                    type="password"
                    required
                    minlength="8"
                    autocomplete="off"
                    placeholder="At least 8 characters"
                  /><button
                    type="button"
                    class="btn outline smallbtn"
                    data-password-toggle="password"
                  >
                    Show
                  </button>
                </div>
                <div id="password-strength" class="form-note">
                  Use at least 8 characters.
                </div>
              </div>
              <div class="field">
                <label for="confirm-password">Confirm sample password</label
                ><input
                  id="confirm-password"
                  type="password"
                  required
                  minlength="8"
                  autocomplete="off"
                  placeholder="Re-enter sample password"
                />
              </div>
              <label
                style="
                  display: flex;
                  gap: 10px;
                  font-size: 0.82rem;
                  margin-bottom: 18px;
                "
                ><input type="checkbox" required /> I understand this is a demo
                form, not a real financial account.</label
              ><button class="btn primary" type="submit" style="width: 100%">
                Preview registration
              </button>
            </form>
          </div>
        </div>
      </section>
    </main>
