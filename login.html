    <main>
      <section class="section">
        <div class="container">
          <div class="card form-card">
            <div class="notice" style="margin-bottom: 22px">
              Demo only. Do not enter a real password or sensitive information.
            </div>
            <form
              data-demo-form
              data-success-message="Demo login form validated. No account was accessed."
            >
              <div class="field">
                <label for="email">Email address</label
                ><input
                  id="email"
                  type="email"
                  required
                  autocomplete="off"
                  placeholder="sample@example.com"
                />
              </div>
              <div class="field">
                <label for="password">Sample password</label>
                <div style="display: flex; gap: 8px">
                  <input
                    id="password"
                    type="password"
                    minlength="8"
                    required
                    autocomplete="off"
                    placeholder="Enter a sample password"
                  /><button
                    type="button"
                    class="btn outline smallbtn"
                    data-password-toggle="password"
                  >
                    Show
                  </button>
                </div>
              </div>
              <button class="btn primary" type="submit" style="width: 100%">
                Preview login
              </button>
            </form>
            <p class="small" style="text-align: center; margin-top: 20px">
              Need a account? <a href="register.html">Create one</a>
            </p>
          </div>
        </div>
      </section>
    </main>
